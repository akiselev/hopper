# hopper-build: `cargo hopper-build` and its rustc driver, which writes `.hsc` ownership
# sidecars. Its own workspace because it links rustc's internals on a pinned nightly
# (rust-toolchain.toml); the rest of hopper builds on stable.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "hopper-build"
version = "0.1.0"
edition = "2024"
publish = false
description = "cargo hopper-build: builds a Rust workspace with the pinned nightly and writes an .hsc ownership sidecar beside each binary."

[package.metadata.rust-analyzer]
rustc_private = true

[[bin]]
name = "cargo-hopper-build"
path = "src/bin/cargo-hopper-build.rs"

[[bin]]
name = "hopper-build-driver"
path = "src/bin/hopper-build-driver.rs"

[dependencies]
rustc_plugin = "=0.15.2-nightly-2026-05-01"
hopper-core = { path = "../crates/hopper-core" }
hopper-sidecar = { path = "../crates/hopper-sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = "0.1"

[build-dependencies]
rustc_plugin = "=0.15.2-nightly-2026-05-01"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
